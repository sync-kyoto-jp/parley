version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Android Gradle Plugin major upgrades are deliberate, tested
      # migrations — do them manually, not via Dependabot.
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major"]
      - dependency-name: com.android.tools.build:gradle
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
